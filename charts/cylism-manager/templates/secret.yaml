{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cylism-manager.secretName" . }}
  labels:
    {{- include "cylism-manager.labels" . | nindent 4 }}
type: Opaque
stringData:
  encryption-key: {{ required "secrets.encryptionKey is required when secrets.existingSecret is empty" .Values.secrets.encryptionKey | quote }}
  jwt-secret: {{ required "secrets.jwtSecret is required when secrets.existingSecret is empty" .Values.secrets.jwtSecret | quote }}
  admin-password: {{ required "secrets.adminPassword is required when secrets.existingSecret is empty" .Values.secrets.adminPassword | quote }}
{{- end }}
