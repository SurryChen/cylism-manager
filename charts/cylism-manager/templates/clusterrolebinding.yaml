apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cylism-manager.fullname" . }}
  labels:
    {{- include "cylism-manager.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "cylism-manager.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "cylism-manager.fullname" . }}
  apiGroup: rbac.authorization.k8s.io
