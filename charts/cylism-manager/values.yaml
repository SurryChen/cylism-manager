replicaCount: 1

# SQLite uses a single writer. Recreate prevents old and new Pods from
# independently writing different database volumes during an upgrade.
strategy:
  type: Recreate

image:
  repository: ghcr.io/surrychen/cylism-manager
  tag: ""
  pullPolicy: Always
  pullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

service:
  type: ClusterIP
  port: 8080

nodeSelector: {}
tolerations: []
affinity: {}

data:
  existingClaim: ""
  storageClass: ""
  size: 5Gi
  accessModes:
    - ReadWriteOnce
ssh:
  existingSecret: cylism-ssh-key

secrets:
  existingSecret: cylism-secret
  encryptionKey: ""
  jwtSecret: ""
  adminPassword: ""

config:
  existingConfigMap: ""
  adminUser: admin
  publicURL: ""
  accessTokenTTL: "7200"
  refreshTokenTTL: "604800"
  operationLogRetentionDays: "30"

dnsWebhookRbac:
  enabled: true
  serviceAccountName: cylism-cert-manager
  serviceAccountNamespace: cert-manager

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
