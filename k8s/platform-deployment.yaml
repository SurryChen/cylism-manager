apiVersion: v1
kind: Service
metadata:
  name: cylism-manager
spec:
  selector:
    app: cylism-manager
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cylism-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cylism-manager
  template:
    metadata:
      labels:
        app: cylism-manager
    spec:
      nodeName: iz7xvf5nfpb7zibg0fq3zfz
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
      serviceAccountName: cylism-manager
      volumes:
        - name: data
          hostPath:
            path: /data/cylism-manager
            type: DirectoryOrCreate
      containers:
        - name: platform
          image: crpi-c5u9bb8i5qxw1m72.cn-guangzhou.personal.cr.aliyuncs.com/surrychen/cylism-manager:latest
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            - name: DATABASE_PATH
              value: /data/cylism.db
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cylism-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cylism-manager
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "secrets"]
    verbs: ["get", "list", "watch", "update", "delete"]
  - apiGroups: ["traefik.io"]
    resources: ["ingressroutes"]
    verbs: ["get", "list", "create", "update", "delete"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["get", "list", "create", "update", "delete"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cylism-manager
subjects:
  - kind: ServiceAccount
    name: cylism-manager
    namespace: default
roleRef:
  kind: ClusterRole
  name: cylism-manager
  apiGroup: rbac.authorization.k8s.io
