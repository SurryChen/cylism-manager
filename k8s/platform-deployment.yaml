apiVersion: v1
kind: Service
metadata:
  name: cylism-manager
spec:
  selector:
    app: cylism-manager
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cylism-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cylism-manager
  template:
    metadata:
      labels:
        app: cylism-manager
    spec:
      nodeSelector:
        kubernetes.io/hostname: iz7xvf5nfpb7zibg0fq3zfz
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
      serviceAccountName: cylism-manager
      volumes:
        - name: data
          hostPath:
            path: /data/cylism-manager
            type: DirectoryOrCreate
        - name: tailscale-socket
          hostPath:
            path: /run/tailscale
            type: DirectoryOrCreate
        - name: ssh-key
          secret:
            secretName: cylism-ssh-key
            defaultMode: 0600
      containers:
        - name: platform
          imagePullPolicy: Always
          image: crpi-c5u9bb8i5qxw1m72.cn-guangzhou.personal.cr.aliyuncs.com/surrychen/cylism-manager:latest
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tailscale-socket
              mountPath: /run/tailscale
            - name: ssh-key
              mountPath: /root/.ssh
              readOnly: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: cylism-secret
                  key: encryption-key
                  optional: true
            - name: DATABASE_PATH
              value: /data/cylism.db
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cylism-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cylism-manager
rules:
  # Validates audience-bound projected Runtime tokens before serving the
  # Manager-internal CLI artifact and Agent API. This grants no Kubernetes
  # workload access to the Runtime ServiceAccount itself.
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["nodes", "pods", "services", "configmaps", "secrets", "namespaces", "endpoints", "events", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  # Required to create the least-privilege VictoriaMetrics scraper role.
  - apiGroups: [""]
    resources: ["nodes/proxy"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "statefulsets/scale"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["traefik.io"]
    resources: ["ingressroutes"]
    verbs: ["get", "list", "create", "update", "delete"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates", "certificaterequests", "issuers", "clusterissuers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["acme.cert-manager.io"]
    resources: ["orders", "challenges"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["helm.cattle.io"]
    resources: ["helmcharts", "helmchartconfigs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cylism-manager
subjects:
  - kind: ServiceAccount
    name: cylism-manager
    namespace: default
roleRef:
  kind: ClusterRole
  name: cylism-manager
  apiGroup: rbac.authorization.k8s.io
---
# cert-manager invokes this cluster-scoped API while processing AliDNS DNS-01 challenges.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cylism-alidns-webhook-solver
  labels:
    app.kubernetes.io/managed-by: cylism-manager
    cylism.io/dns-provider: alidns
rules:
  - apiGroups: ["acme.cylism.io"]
    resources: ["alidns"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cylism-alidns-webhook-solver
  labels:
    app.kubernetes.io/managed-by: cylism-manager
    cylism.io/dns-provider: alidns
subjects:
  - kind: ServiceAccount
    name: cylism-cert-manager
    namespace: cert-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cylism-alidns-webhook-solver
