site_name: Cylism Manager
site_description: 面向 Tailscale 与 K3s 的基础设施控制台
site_url: !ENV [SITE_URL, ""]
repo_name: cylism/cylism-manager
edit_uri: edit/main/docs/

exclude_docs: |
  archive/**
  design/**
  k3s-tailscale-deployment.md

theme:
  name: material
  language: zh
  logo: assets/cylism-manager-icon.svg
  favicon: assets/cylism-manager-icon.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - 首页: index.md
  - 快速开始: getting-started.md
  - 安装部署:
      - 前置条件: installation/prerequisites.md
      - 脚本安装: installation/install-script.md
      - Helm 安装: installation/install-helm.md
  - 使用指南:
      - 首次登录与服务器纳管: getting-started.md
      - 配置参考: operations/configuration.md
  - 运维与排障:
      - 日常运维: operations/operations.md
      - 常见问题: operations/troubleshooting.md
  - 安全: security.md
  - 开发与贡献: development/contributing.md
