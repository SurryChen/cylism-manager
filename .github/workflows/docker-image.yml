name: Build and Push Docker Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  REGISTRY: crpi-c5u9bb8i5qxw1m72.cn-guangzhou.personal.cr.aliyuncs.com
  IMAGE_NAME: surrychen/cylism-manager

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Alibaba Cloud Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name == 'push' }}
          build-args: |
            GOPROXY=https://goproxy.cn,direct
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Resolve and verify pushed image manifest
        id: pushed-image
        if: github.event_name == 'push'
        env:
          REPOSITORY: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          for attempt in {1..12}; do
            digest="$(docker buildx imagetools inspect "$IMAGE_TAG" --format '{{.Digest}}' 2>/dev/null || true)"
            if [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              image="$REPOSITORY@$digest"
              if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
                printf 'image=%s\n' "$image" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "The pushed image manifest is unavailable from the registry: $IMAGE_TAG" >&2
          exit 1

      - name: Notify Cylism platform deployment
        if: github.event_name == 'push'
        env:
          CYLISM_DEPLOY_WEBHOOK_SECRET: ${{ secrets.CYLISM_DEPLOY_WEBHOOK_SECRET }}
          CYLISM_DEPLOY_IP: ${{ secrets.CYLISM_DEPLOY_IP }}
          IMAGE: ${{ steps.pushed-image.outputs.image }}
        run: |
          test -n "$CYLISM_DEPLOY_WEBHOOK_SECRET"
          timestamp="$(date +%s)"
          nonce="$(openssl rand -hex 16)"
          body="$(printf '{\"image\":\"%s\",\"commit_sha\":\"%s\",\"run_id\":\"%s\"}' "$IMAGE" "$GITHUB_SHA" "$GITHUB_RUN_ID")"
          signature="$(printf '%s.%s.%s' "$timestamp" "$nonce" "$body" | openssl dgst -sha256 -hmac "$CYLISM_DEPLOY_WEBHOOK_SECRET" -hex | sed 's/^.* //')"
          curl_args=(--fail-with-body --retry 3 --retry-all-errors
            -X POST
            -H 'Content-Type: application/json'
            -H "X-Cylism-Timestamp: $timestamp"
            -H "X-Cylism-Nonce: $nonce"
            -H "X-Cylism-Signature: $signature"
            --data "$body")
          if test -n "$CYLISM_DEPLOY_IP"; then
            curl_args+=(--resolve "cylism.crazycoding.top:443:$CYLISM_DEPLOY_IP")
          fi
          curl "${curl_args[@]}" \
            https://cylism.crazycoding.top/api/platform/deployments
